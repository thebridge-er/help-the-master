<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTM</title>
    <link rel="stylesheet" href="../src/styles/global.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+24&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="nav">
            <div class="logo">
                <a href="../../index.html">
                    <h1>HTM</h1>
                </a>
            </div>

            <div class="header-right">
                <button class="login-btn" onclick="window.location = './pages/auth/auth.html'">Regístrate</button>
            </div>
        </nav>
    </header>

    <section class="features">
        <h2 class="pixel-type">help the master!</h2>
        <img id="boton" src="./img/boton1.png" alt="Botón" class="shine-btn">
        <h3 class="pixel-type blink">Press the button to create caos!</h3>
    </section>

    <footer class="footer">
        <p>
            A veces un master necesita ayuda
        </p>
    </footer>

    <script type="module" src="./js/global.js"></script>

    <script type="module">
        // Espera a que todo el DOM cargue
        window.addEventListener("load", () => {
            const boton = document.getElementById("boton");

            boton.addEventListener("click", () => {
                // Cambia la imagen del botón
                boton.src = "img/boton2.png";

                // Espera 150ms antes de navegar para ver el efecto
                setTimeout(() => {
                    // Navega a la otra página
                    window.location.href = "pages/auth/auth.html";
                }, 150);
            });
        });
    </script>
</body>

</html>
