<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTM Login</title>
    <link rel="stylesheet" href="./auth.css">
    <link rel="stylesheet" href="../../styles/global.css">
</head>

<body>
    <header>
        <nav class="nav">
            <div class="logo">
                <a href="../../index.html">
                    <h1>HTM</h1>
                </a>
            </div>

            <div class="header-right">
                <button class="login-btn" onclick="window.location = './pages/auth/auth.html'"></button>
            </div>
        </nav>
    </header>

    <section class="auth" id="authSection">
        <div class="auth-card">

            <h2 id="formTitle">Login</h2>

            <input id="nameField" placeholder="Nombre" style="display: none" />

            <label>Correo</label>
            <input id="email" placeholder="email@ejemplo.com" autocomplete="off" />

            <label>Contraseña</label>
            <input id="password" type="password" placeholder="********" autocomplete="off" />

            <button id="mainBtn">
                Iniciar Sesión
            </button>

            <p id="errorMsg" class="error-msg"></p>

            <p id="switchText">
                <span>¿No tienes cuenta?</span>
                <span id="registerLink">
                    Registrarse
                </span>
            </p>

        </div>
    </section>

    <footer class="footer">
        <p>
            A veces un master necesita ayuda
        </p>
    </footer>
    <script type="module" src="../../app.js"></script>
    <script src="./global.js"></script>
</body>

</html>
