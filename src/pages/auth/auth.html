<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTM Login</title>
    <link rel="stylesheet" href="../auth/auth.css">
    <link rel="stylesheet" href="../../styles/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="nav">
            <div class="logo">
                <a href="../../index.html">
                    <h1>HTM</h1>
                </a>
            </div>
        </nav>
    </header>

    <section class="auth" id="authSection">
        <img class="torch left" src="../../img/torch2.gif" alt="Antorcha izquierda">
        <div class="auth-card">

            <h2 id="formTitle">Login</h2>

            <input id="nameField" placeholder="Nombre" style="display: none" />

            <label>Correo</label>
            <input id="email" placeholder="email@ejemplo.com" autocomplete="off" />

            <label>Contraseña</label>
            <input id="password" type="password" placeholder="********" autocomplete="off" />

            <button id="mainBtn">
                Iniciar Sesión
            </button>

            <p id="errorMsg" class="error-msg"></p>

            <p id="switchText">
                <span>¿No tienes cuenta?</span>
                <span id="registerLink">
                    Registrarse
                </span>
            </p>
        </div>
        <img class="torch right" src="../../img/torch2.gif" alt="Antorcha derecha">
    </section>

    <footer class="footer">
        <p>
            A veces un master necesita ayuda
        </p>
    </footer>
    <script type="module" src="./auth.js"></script>
    <script src="../../js/global.js"></script>
</body>

</html>
