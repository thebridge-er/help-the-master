<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTM</title>
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../dashboard/dashboard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+24&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="nav">
            <div class="logo">
                <a href="../../index.html">
                    <h1>HTM</h1>
                </a>
            </div>
        </nav>
    </header>

    <section class="cards-section">

        <div class="card">
            <h2>Crea un NPC</h2>
            <img class="card-gif" src="../../img/npc.gif" alt="gif">
            <button class="card-btn">
                <img class="animated-btn" src="../../img/boton1.png" alt="botón"
                    data-link="../../pages/npc-generator/npc-generator.html">
            </button>
        </div>

        <div class="card">
            <h2>Crea un enemigo</h2>
            <img class="card-gif" src="../../img/orco.gif" alt="gif">
            <button class="card-btn">
                <img class="animated-btn" src="../../img/boton1.png" alt="botón"
                    data-link="../../pages/enemy-generator/enemy-generator.html">
            </button>
        </div>

        <div class="card">
            <h2>Crea el caos</h2>
            <img class="card-gif" src="../../img/caos.gif" alt="gif">
            <button class="card-btn">
                <img class="animated-btn" src="../../img/boton1.png"
                    data-link="../../pages/caos-generator/caos-generator.html">
            </button>
        </div>

        <div class="card">
            <h2>Crea una escapatoria</h2>
            <img class="card-gif" src="../../img/situacion.gif" alt="gif">
            <button class="card-btn">
                <img class="animated-btn" src="../../img/boton1.png" data-link="../../pages/excuses/excuses.html">
            </button>
        </div>

    </section>

    <footer class="footer">
        <p>
            A veces un master necesita ayuda
        </p>
    </footer>

    <script type="module" src="./js/global.js"></script>
    <script type="module" src="./dashboard.js"></script>

</body>

</html>
