<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTM</title>
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../enemy-generator/enemy-generator.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <nav class="nav">
            <div class="logo">
                <a href="../../index.html">
                    <h1>HTM</h1>
                </a>
            </div>

            <div class="header-right">
                <button class="login-btn" onclick="window.location = '../dashboard/dashboard.html'">Menú</button>
            </div>
        </nav>
    </header>

    <section class="enemy-section">

        <div class="card">
            <img class="card-gif" src="../../img/orco.gif" alt="gif">
        </div>

        <div class="enemy-card">

            <div class="enemy-card">
                <h2>Aquí tienes tu NPC:</h2>

                <div class="stats-box" id="enemyOutput"></div>

                <button id="generateBtn">Generar otro enemigo</button>
                <button id="downloadBtn">Descargar ficha</button>
                <i class="fa-solid fa-heart favorite-icon" id="enemyFavorite"></i>

            </div>
        </div>

    </section>

    <footer class="footer">
        <p>
            A veces un master necesita ayuda
        </p>
    </footer>

    <script type="module" src="../../js/global.js"></script>
    <script type="module" src="./enemy-generator.js"></script>

</body>

</html>
