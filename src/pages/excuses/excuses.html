<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTM</title>
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../excuses/excuses.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+24&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="nav">
            <div class="logo">
                <a href="../../index.html">
                    <h1>HTM</h1>
                </a>
            </div>

            <div class="header-right">
                <button class="login-btn" onclick="window.location = '../dashboard/dashboard.html'">Menú</button>
            </div>
        </nav>
    </header>

    <section class="excuses-section">

        <div class="card">
            <img class="card-gif" src="../../img/situacion.gif" alt="gif">
        </div>

        <div class="excuse-card">
            <h2 id="formTitle">Cuéntame qué ha pasado</h2>

            <form id="excuseForm">
                <textarea id="situationField" placeholder="Quiénes y dónde estáis..." rows="4"></textarea>
                <button type="submit" id="mainBtn">¡Sácame de esta situación!</button>
            </form>

            <div id="excuseOutput" class="excuse-output"></div>
        </div>

    </section>

    <footer class="footer">
        <p>
            A veces un master necesita ayuda
        </p>
    </footer>

    <script type="module" src="../../js/global.js"></script>
    <script type="module" src="../../services/excusesgenerator.js"></script>
    <script type="module" src="../../services/keywords.js"></script>
    <script type="module" src="../../services/localStorage.js"></script>

</body>

</html>
